name: Feature request
description: Propose a focused improvement to DistLLM
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What concrete problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the API, execution path, or documentation change.
    validations:
      required: true
  - type: textarea
    id: correctness
    attributes:
      label: Correctness plan
      description: How should this be verified against an independent oracle?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This proposal preserves DistLLM's focus on auditable distributed-training behavior.
          required: true
